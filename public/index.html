<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>TaskFlow</h1>
    <div id="userbox" class="hidden">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="btn ghost">Log out</button>
    </div>
  </header>

  <main>
    <!-- Auth -->
    <section id="authView" class="card narrow">
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Log in</button>
        <button id="tabRegister" class="tab" type="button">Sign up</button>
      </div>
      <form id="authForm" novalidate>
        <label>Email <input id="email" type="email" autocomplete="email" required></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <p id="authError" class="error" role="alert"></p>
        <button id="authSubmit" class="btn primary" type="submit">Log in</button>
      </form>
    </section>

    <!-- App -->
    <section id="appView" class="hidden">
      <div class="stats">
        <div class="stat"><span id="statTotal">0</span><small>Total</small></div>
        <div class="stat"><span id="statDone">0</span><small>Completed</small></div>
        <div class="stat warn"><span id="statOverdue">0</span><small>Overdue</small></div>
      </div>

      <form id="taskForm" class="card" novalidate>
        <div class="row">
          <input id="title" type="text" placeholder="What needs doing?" maxlength="200" required>
          <select id="priority" aria-label="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <input id="due" type="date" aria-label="Due date">
          <button class="btn primary" type="submit">Add</button>
        </div>
        <textarea id="notes" placeholder="Notes (optional)" maxlength="2000" rows="2"></textarea>
        <p id="taskError" class="error" role="alert"></p>
      </form>

      <div class="filters" role="tablist">
        <button class="chip active" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="active" type="button">Active</button>
        <button class="chip" data-filter="completed" type="button">Completed</button>
      </div>

      <ul id="taskList" class="tasks"></ul>
      <p id="empty" class="muted hidden">No tasks here yet. Add one above.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
